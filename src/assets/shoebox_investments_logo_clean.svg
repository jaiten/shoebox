<svg width="100%" viewBox="0 0 760 122" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Shoebox Investments Inc logo</title>
  <desc>Minimal wordmark logo with geometric square mark and company name</desc>

  <g transform="translate(18 22)">
    <rect x="0" y="0" width="78" height="78" rx="2" fill="none" stroke="#FAF9F5" stroke-width="2.25"/>
    <rect x="12" y="12" width="21" height="21" rx="1" fill="#FAF9F5"/>
    <rect x="45" y="12" width="21" height="21" rx="1" fill="#FAF9F5"/>
    <rect x="12" y="45" width="21" height="21" rx="1" fill="#FAF9F5"/>
    <rect x="45" y="45" width="21" height="21" rx="1" fill="#FAF9F5" opacity="0.3"/>

    <line x1="92" y1="0" x2="92" y2="78" stroke="rgba(222, 220, 209, 0.75)" stroke-width="1"/>

    <text
      x="112"
      y="45"
      fill="#FAF9F5"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="42"
      font-weight="400"
      textLength="252"
      lengthAdjust="spacingAndGlyphs"
    >
      SHOEBOX
    </text>
    <text
      x="112"
      y="72"
      fill="#C2C0B6"
      font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
      font-size="12"
      font-weight="500"
      letter-spacing="4"
      textLength="252"
      lengthAdjust="spacingAndGlyphs"
    >
      INVESTMENTS INC
    </text>
  </g>
</svg>
