<svg width="100%" viewBox="0 0 760 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Shoebox Investments Inc logo</title>
  <desc>Deep forest green and champagne gold wordmark with geometric investment grid mark</desc>

  <defs>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B472"/>
      <stop offset="100%" stop-color="#B8943E"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3929"/>
      <stop offset="100%" stop-color="#0E2116"/>
    </linearGradient>
  </defs>

  <g transform="translate(18 22)">
    <rect x="0" y="0" width="78" height="78" rx="2" fill="none" stroke="#1A3929" stroke-width="2.25"/>
    <rect x="12" y="12" width="21" height="21" rx="1" fill="url(#greenFill)"/>
    <rect x="45" y="12" width="21" height="21" rx="1" fill="url(#goldFill)"/>
    <rect x="12" y="45" width="21" height="21" rx="1" fill="url(#goldFill)"/>
    <rect x="45" y="45" width="21" height="21" rx="1" fill="#1A3929" opacity="0.28"/>

    <line x1="92" y1="0" x2="92" y2="78" stroke="#C4A25A" stroke-width="1"/>

    <text
      x="112"
      y="45"
      fill="#1A3929"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="42"
      font-weight="400"
      textLength="252"
      lengthAdjust="spacingAndGlyphs"
    >
      SHOEBOX
    </text>
    <text
      x="112"
      y="72"
      fill="#C4A25A"
      font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
      font-size="12"
      font-weight="500"
      letter-spacing="4"
      textLength="252"
      lengthAdjust="spacingAndGlyphs"
    >
      INVESTMENTS INC
    </text>
  </g>
</svg>
